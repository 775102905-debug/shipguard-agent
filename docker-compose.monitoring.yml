version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: shipguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - shipguard-net

networks:
  shipguard-net:
    driver: bridge
